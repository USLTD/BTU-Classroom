<!doctype html>
<html><body><div class="col-md-18">
  <fieldset>
    <legend>სასურველი ძირითადი/დამატებითი პროგრამები</legend>

        <div class="row form-group"><label class="col-sm-4 control-label">ფაკულტეტი</label><div class="col-sm-16"><input type="text" value="Sample faculty" disabled="disabled" class="form-control"></div></div>

  </fieldset>
