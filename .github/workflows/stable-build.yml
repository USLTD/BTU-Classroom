name: Stable Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Stable Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
             app/build/outputs/apk/release/BTU-Classroom-v${{ inputs.version }}.apk

      - name: Get last stable release
        id: last_release
        run: |
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            echo "tag=" >> $GITHUB_OUTPUT
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "tag=$LAST_TAG" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          echo "# BTU Classroom v${{ inputs.version }}" > changelog.md
          echo "" >> changelog.md
          echo "Release Date: $(date +%Y-%m-%d)" >> changelog.md
          echo "" >> changelog.md

          if [ "${{ steps.last_release.outputs.found }}" == "true" ]; then
            echo "## Changes since ${{ steps.last_release.outputs.tag }}" >> changelog.md
            echo "" >> changelog.md

            # Group commits by conventional commit type
            echo "### Features" >> changelog.md
            git log ${{ steps.last_release.outputs.tag }}..HEAD --pretty=format:"%s" | grep "^feat" | sed 's/^feat[:(]/- /' | sed 's/):/:/g' >> changelog.md || echo "- No new features" >> changelog.md
            echo "" >> changelog.md

            echo "### Bug Fixes" >> changelog.md
            git log ${{ steps.last_release.outputs.tag }}..HEAD --pretty=format:"%s" | grep "^fix" | sed 's/^fix[:(]/- /' | sed 's/):/:/g' >> changelog.md || echo "- No bug fixes" >> changelog.md
            echo "" >> changelog.md

            echo "### Documentation" >> changelog.md
            git log ${{ steps.last_release.outputs.tag }}..HEAD --pretty=format:"%s" | grep "^docs" | sed 's/^docs[:(]/- /' | sed 's/):/:/g' >> changelog.md || echo "- No documentation changes" >> changelog.md
            echo "" >> changelog.md

            echo "### Refactoring" >> changelog.md
            git log ${{ steps.last_release.outputs.tag }}..HEAD --pretty=format:"%s" | grep "^refactor" | sed 's/^refactor[:(]/- /' | sed 's/):/:/g' >> changelog.md || echo "- No refactoring" >> changelog.md
            echo "" >> changelog.md

            echo "### Performance Improvements" >> changelog.md
            git log ${{ steps.last_release.outputs.tag }}..HEAD --pretty=format:"%s" | grep "^perf" | sed 's/^perf[:(]/- /' | sed 's/):/:/g' >> changelog.md || echo "- No performance improvements" >> changelog.md
            echo "" >> changelog.md

            echo "### Build & CI" >> changelog.md
            git log ${{ steps.last_release.outputs.tag }}..HEAD --pretty=format:"%s" | grep -E "^(build|ci)" | sed -E 's/^(build|ci)[:(]/- /' | sed 's/):/:/g' >> changelog.md || echo "- No build/CI changes" >> changelog.md
            echo "" >> changelog.md

            echo "### Other Changes" >> changelog.md
            git log ${{ steps.last_release.outputs.tag }}..HEAD --pretty=format:"%s" | grep -vE "^(feat|fix|docs|refactor|perf|test|build|ci|chore)" | sed 's/^/- /' >> changelog.md || echo "- No other changes" >> changelog.md
            echo "" >> changelog.md

            echo "---" >> changelog.md
            echo "" >> changelog.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.last_release.outputs.tag }}...v${{ inputs.version }}" >> changelog.md
          else
            echo "## Initial Release" >> changelog.md
            echo "" >> changelog.md
            echo "This is the first stable release of BTU Classroom." >> changelog.md
            echo "" >> changelog.md
            echo "### All Commits" >> changelog.md
            git log --pretty=format:"- %s (%h)" >> changelog.md
          fi

      - name: Create Stable Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}
          name: BTU Classroom v${{ inputs.version }}
          body_path: changelog.md
          files: app/build/outputs/apk/release/BTU-Classroom-v${{ inputs.version }}.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTU-Classroom-v${{ inputs.version }}
          path: app/build/outputs/apk/release/BTU-Classroom-v${{ inputs.version }}.apk
          retention-days: 90
