name: Preview Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build Preview APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Get commit details
        id: commit
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          COMMIT_DATE=$(git log -1 --pretty=%cd --date=short)

          echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "date=$COMMIT_DATE" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/BTU-Classroom-preview-${{ steps.commit.outputs.hash }}.apk

      - name: Generate changelog
        id: changelog
        run: |
          echo "## Preview Build - ${{ steps.commit.outputs.hash }}" > changelog.md
          echo "" >> changelog.md
          echo "**Commit:** ${{ steps.commit.outputs.message }}" >> changelog.md
          echo "**Author:** ${{ steps.commit.outputs.author }}" >> changelog.md
          echo "**Date:** ${{ steps.commit.outputs.date }}" >> changelog.md
          echo "" >> changelog.md
          echo "### Changes in this commit" >> changelog.md
          git log -1 --pretty=%b >> changelog.md

          # Parse commit using conventional commits
          COMMIT_MSG="${{ steps.commit.outputs.message }}"
          if [[ $COMMIT_MSG =~ ^(feat|fix|docs|style|refactor|perf|test|chore|build|ci)(\(.+\))?:\ .+ ]]; then
            TYPE=$(echo "$COMMIT_MSG" | cut -d: -f1 | cut -d'(' -f1)
            echo "" >> changelog.md
            echo "**Type:** \`$TYPE\`" >> changelog.md
          fi

      - name: Create Preview Release
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: preview-${{ steps.commit.outputs.hash }}
          name: Preview Build ${{ steps.commit.outputs.hash }}
          body_path: changelog.md
          files: app/build/outputs/apk/debug/BTU-Classroom-preview-${{ steps.commit.outputs.hash }}.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTU-Classroom-preview-${{ steps.commit.outputs.hash }}
          path: app/build/outputs/apk/debug/BTU-Classroom-preview-${{ steps.commit.outputs.hash }}.apk
          retention-days: 30
